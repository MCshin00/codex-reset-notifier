# API 조회 간격 (분). 아래 시간대의 매일 00:00을 기준으로 실행 시각을 정합니다.
# 30 = 매시 00분/30분, 60 = 매시 00분, 15 = 매시 00분/15분/30분/45분.
# 21:28에 시작하고 30분으로 설정했다면 첫 조회는 21:30, 이후 22:00, 22:30입니다.
# 시작/재시작 시 다음 예약 시각까지 기다립니다. --once와 --dry-run은 즉시 실행합니다.
# 1440으로 나누어떨어지지 않는 간격은 매일 자정에 기준을 다시 맞춥니다.
# 수정 후 docker compose restart notifier 로 반영합니다.
poll.interval.minutes=30

# 알림 범위: 아래 세 값 중 하나를 선택합니다 (소문자, 하이픈 포함).
# reset-only          : 사이트가 실행된 것으로 기록한 실제 리셋만 알림.
# reset-and-scheduled : 실제 리셋 + 명시적인 리셋 예정 공지(scheduled_reset). 기본값.
# all                 : 위 두 종류 + 사이트의 리셋 가능성 예측(active_watch).
#                       예측은 elevated/strong 모두 포함. 확률이 null이어도 '미제공'으로 알림.
#                       '리셋 가능성 예측'으로 표시하며, 만료된 예측은 알리지 않습니다.
#
# 최초 실행: 과거 실제 리셋은 저장만 하고 보내지 않습니다.
#            선택 범위에 포함되는 현재 예정 공지/예측은 한 번 알립니다.
# 중복 방지: 같은 실제 리셋은 한 번, 같은 예정 공지는 예정 시각이 바뀌면 추가 알림.
#            예측은 출처/본문/강도/확률/예측 구간이 바뀌면 아직 보내지 않은 내용에 한해 알림.
#            관측/만료 시각만 바뀌면 재전송하지 않습니다.
# 단계 변경: 예측 → 예정 공지 → 실제 리셋은 서로 다른 종류로 각각 알립니다.
# 범위 확대: 재시작 후 새로 포함한 종류의 현재 미전송 공지도 알립니다.
# API 조회 사이에 나타났다가 사라진 예정 공지/예측은 놓칠 수 있습니다.
notify.scope=reset-and-scheduled

# 조회 스케줄 기준 및 디스코드 메시지 표시 시간대
display.time.zone=Asia/Seoul
